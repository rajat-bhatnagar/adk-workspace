[project]
name = "travel-agent"
version = "0.1.0"
description = "Travel assistant agent using ADK, remote A2A currency agent, and local weather agent"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.10.0",
    "a2a-sdk>=1.1.5",
    "google-genai>=2.25.0",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.35.0",
    "httpx>=0.28.1",
    "sse-starlette>=3.0.0",
]

[tool.setuptools]
py-modules = []
